# Конфигурация Alembic для проекта «Семейные расходы».
#
# URL базы НЕ задаётся здесь: alembic/env.py берёт его из app.config.settings
# (переменная окружения DB_PATH или .env). Так миграции и приложение всегда
# смотрят на один и тот же файл SQLite.
#
# Типовые команды (из корня проекта):
#     alembic upgrade head
#     alembic current
#     alembic downgrade -1
#     alembic revision -m "add column" --autogenerate

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Оставляем пустым — см. комментарий выше (или задайте для разовой миграции).
sqlalchemy.url =

[post_write_hooks]

# --------------------------------------------------------------------------- #
# Логирование
# --------------------------------------------------------------------------- #
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
